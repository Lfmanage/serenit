/* ---------- Retrait (motif obligatoire) ---------- */
function openWithdraw(pocket,o={}){
  const isE=isSaving(pocket),goals=S.goals.filter(g=>goalPocket(g)===pocket);
  const dests=[['none',"Nulle part, l'argent sort"],...activePockets().filter(p=>p.id!==pocket).map(p=>[p.id,'Vers '+pName(p.id)])];
  const src=isE&&goals.length?F.select('goal','Pris sur',[['','Épargne non affectée'],...goals.map(g=>[g.id,`${g.name} (${money(Math.max(0,goalSaved(g.id)))})`])],o.goal||''):'';
  const s=sheet(`<h2>Retirer de ${esc(pName(pocket))}</h2><p class="sub">Solde actuel : ${money(balance(pocket))}</p><form novalidate>
    ${F.money('amount','Montant','',{big:true,auto:true})}
    ${F.text('label','Motif (obligatoire)','',{ph:'Pourquoi ce retrait ?'})}
    ${src}${F.select('dest','Destination',dests,'none')}${F.date('date','Date')}
    <button class="btn block" type="submit" disabled>Confirmer le retrait</button></form>`);
  const f=s.querySelector('form'),btn=f.querySelector('[type=submit]');
  const upd=()=>{btn.disabled=!(parseMoney(f.amount.value)>0&&f.label.value.trim())};
  f.addEventListener('input',upd);
  f.addEventListener('submit',e=>{
    e.preventDefault();const d=readForm(f),a=parseMoney(d.amount);
    let ok=setErr(f,'amount',a>0?'':'Indique un montant.')&setErr(f,'label',d.label?'':'Le motif est obligatoire pour un retrait.');
    if(ok&&!canDebit(pocket,a))ok=setErr(f,'amount',`Solde insuffisant : ${pName(pocket)} n\u2019a que ${money(Math.max(0,balance(pocket)))}. Cette opération dépasse le solde disponible de cette poche.`);
    if(ok&&isE){
      const avail=d.goal?Math.max(0,goalSaved(d.goal)):(goals.length?unallocated(pocket):balance(pocket));
      if(a>avail)ok=setErr(f,'amount',d.goal?`Cet objectif contient ${money(avail)}.`:`Il y a ${money(avail)} d'épargne non affectée. Choisis un objectif.`);
    }
    if(!ok)return;
    const date=d.date||today(),g=isE?(d.goal||undefined):undefined;
    if(d.dest==='none'){if(!addTx({d:date,a:-a,p:pocket,k:'depense',c:'autre',l:d.label,g,r:1}))return}
    else if(!addTransfer(pocket,d.dest,a,date,d.label,d.label,{fromG:g,r:1}))return;
    if(g)checkGoal(goalById(g));
    closeSheet();render();toast(`${money(a)} retirés de ${pName(pocket)}.`);
  });
}
/* ---------- Mettre de côté ---------- */
function openSave(arg,o={}){
  const sp=savingPockets();
  if(!sp.length){toast('Crée d\u2019abord une poche de type épargne.');openPocketForm(null,{type:'epargne'});return}
  let goalId='',to=sp[0].id;
  if(arg&&arg.startsWith('to:'))to=arg.slice(3);else if(arg){const g0=goalById(arg);if(g0){goalId=arg;to=goalPocket(g0)}}
  const unFor=pid=>Math.max(0,unallocated(pid));
  const srcs=courantPockets().map(p=>[p.id,'Depuis '+pName(p.id)]);
  sp.forEach(p=>{const u=unFor(p.id);if(u>0&&S.goals.some(g=>goalPocket(g)===p.id))srcs.push(['un:'+p.id,`Non affecté de ${pName(p.id)} (${money(u)})`])});
  const goals=S.goals.filter(g=>sp.some(p=>p.id===goalPocket(g)));
  const s=sheet(`${o.fab?qsHTML('epargne'):''}<h2>Mettre de côté</h2><p class="sub">L'argent rejoint ton épargne${goals.length?' et peut aller vers un objectif':''}.</p><form novalidate>
    ${F.money('amount','Montant','',{big:true,auto:true})}
    ${srcs.length?F.select('src','Origine',srcs,srcs[0][0]):''}
    ${sp.length>1?F.select('dest','Vers',sp.map(p=>[p.id,pName(p.id)]),to):''}
    ${goals.length?F.select('goal','Objectif',[['','Sans objectif précis'],...goals.map(g=>[g.id,sp.length>1?`${g.name} (${pName(goalPocket(g))})`:g.name])],goalId):''}
    ${F.date('date','Date')}<button class="btn block" type="submit">Mettre de côté</button></form>`);
  const f=s.querySelector('form');
  f.addEventListener('submit',e=>{
    e.preventDefault();const d=readForm(f),a=parseMoney(d.amount);
    let ok=setErr(f,'amount',a>0?'':'Indique un montant.');
    if(ok&&!d.src)ok=setErr(f,'amount','Crée d\u2019abord une poche d\u2019où prendre l\u2019argent.');
    const g=d.goal?goalById(d.goal):null,dest=g?goalPocket(g):(d.dest||to);
    let from=d.src;
    if(ok&&from&&from.startsWith('un:')){
      from=from.slice(3);
      if(!g)ok=setErr(f,'amount','Choisis l\u2019objectif qui reçoit cette épargne.');
      else if(goalPocket(g)!==from)ok=setErr(f,'amount','Choisis un objectif de cette même poche.');
      else if(a>unFor(from))ok=setErr(f,'amount',`Il y a ${money(unFor(from))} non affectés.`);
    }
    if(ok&&from&&!canDebit(from,a))ok=setErr(f,'amount',`Solde insuffisant : ${pName(from)} n\u2019a que ${money(Math.max(0,balance(from)))}.`);
    if(!ok)return;
    const date=d.date||today(),label=g?`Épargne : ${g.name}`:'Mise de côté';
    if(!addTransfer(from,dest,a,date,label,label,{toG:g?g.id:undefined}))return;
    if(g)checkGoal(g);
    closeSheet();render();toast(`${money(a)} mis de côté${g?` pour ${g.name}`:''}.`);
  });
}

function openGoalForm(g,pocketHint){
  const sp=savingPockets();
  if(!g&&!sp.length){toast('Crée d\u2019abord une poche de type épargne pour y ranger tes objectifs.');openPocketForm(null,{type:'epargne'});return}

    e.preventDefault();const d=readForm(f),target=parseMoney(d.target),monthly=d.monthly?parseMoney(d.monthly):0,init=d.initial?parseMoney(d.initial):0;
    const ok=setErr(f,'name',d.name?'':'Donne un nom à ton objectif.')&setErr(f,'target',target>0?'':'Indique le montant à atteindre.')&setErr(f,'monthly',isNaN(monthly)?'Montant invalide.':'')&(g?1:setErr(f,'initial',isNaN(init)?'Montant invalide.':''));
    if(!ok)return;
    const pid=d.pocket||cur;
    if(g){
      if(pid!==goalPocket(g)){const saved=goalSaved(g.id);if(saved>0){const link=uid();addTx({d:today(),a:-saved,p:goalPocket(g),k:'transfert',l:'Objectif déplacé : '+g.name,g:g.id,link});addTx({d:today(),a:saved,p:pid,k:'transfert',l:'Objectif déplacé : '+g.name,g:g.id,link})}}
      Object.assign(g,{name:d.name,target,date:d.date||null,monthly:monthly||0,pocket:pid});if(!g.nf)g.nf={};g.nf.done=0;g.nf.half=goalSaved(g.id)>=target/2?1:0;
    }else{
      g={id:uid(),name:d.name,target,date:d.date||null,monthly:monthly||0,pocket:pid,created:today(),nf:{}};S.goals.push(g);
      if(init>0){
        const fromUn=Math.min(init,Math.max(0,unallocated(pid)+0));
        if(fromUn>0){const link=uid();addTx({d:today(),a:-fromUn,p:pid,k:'transfert',l:'Affectation : '+g.name,link});addTx({d:today(),a:fromUn,p:pid,k:'transfert',l:'Affectation : '+g.name,g:g.id,link})}
        if(init-fromUn>0)addTx({d:today(),a:init-fromUn,p:pid,k:'ouverture',l:'Montant de départ : '+g.name,g:g.id});
      }
    }
    Store.core();checkGoal(g);closeSheet();render();toast(`Objectif ${g.name} enregistré.`);
  });
}
function openGoal(id){
  const g=goalById(id);if(!g)return;
  const saved=Math.max(0,goalSaved(g.id)),pct=g.target?Math.min(100,saved/g.target*100):0,done=saved>=g.target,rest=Math.max(0,g.target-saved);
  let tips='';
  if(!done&&g.monthly>0){const n=Math.ceil(rest/g.monthly);tips+=`<p class="s">À ${money(g.monthly)} par mois, objectif atteint vers ${fMonth.format(parseISO(addMonths(startOfMonth(today()),n)))}.</p>`}
  if(!done&&g.date&&g.date>today()){const n=Math.max(1,monthsBetween(today(),g.date)+1);tips+=`<p class="s">Pour le ${dLong(g.date)}, il faudrait environ ${money(Math.ceil(rest/n))} par mois.</p>`}
  const moves=allTx().filter(t=>t.g===g.id).slice(0,15);
  const s=sheet(`<h2>${esc(g.name)}</h2><div class="sheet-amt">${fmtPct(pct)}</div>${barHTML('sheet'+g.id,pct,done)}
    <p class="t num" style="margin:10px 0 2px">${money(saved)} / ${money(g.target)}</p>${done?`<p style="margin:0 0 8px"><span class="reached">${I.check}Objectif atteint</span></p>`:`<p class="s" style="margin:0 0 8px">Reste ${money(rest)}</p>`}${tips}
    <div class="actions"><button class="btn" data-a="saveMoney" data-id="${g.id}">Verser</button><button class="btn ghost" data-w>Retirer</button></div>
    ${moves.length?`<h3 class="grp">Derniers mouvements</h3><div class="list">${moves.map(t=>txRow(t)).join('')}</div>`:''}
    <div class="actions"><button class="btn ghost" data-e>Modifier</button><button class="btn quiet" data-d>Supprimer</button></div>`);
  s.querySelector('[data-w]').onclick=()=>openWithdraw(goalPocket(g),{goal:g.id});
  s.querySelector('[data-e]').onclick=()=>openGoalForm(g);
  s.querySelector('[data-d]').onclick=async()=>{
    if(!await ask('Supprimer cet objectif ?',"L'argent déjà mis de côté reste sur ton épargne, sans objectif.",{ok:'Supprimer',danger:true}))return;
    S.goals=S.goals.filter(x=>x.id!==g.id);Store.core();closeSheet();render();toast('Objectif supprimé.');
  };
}

}

/* ---------- Mode discret ---------- */
const MONEY_RE=/[−+-]?\d{1,3}(?:[\s\u00a0\u202f]\d{3})*,\d{2}[\s\u00a0\u202f]?€/g;
const maskText=x=>String(x).replace(MONEY_RE,'••••\u00a0€');
function maskMoney(root){
  if(!U.discreet||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){const v=maskText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
}

/* ---------- Suppression d'une poche : la poche disparaît, son historique reste ---------- */
function openDeletePocket(p){
  const others=activePockets().filter(x=>x.id!==p.id);
  if(!others.length){toast('Garde au moins une poche.');return}
  const v=balance(p.id);
  if(v<0){toast('Cette poche est sous zéro : corrige d\u2019abord son solde.');return}
  const bills=S.bills.filter(b=>!b.deleted&&b.pocket===p.id),goals=S.goals.filter(g=>goalPocket(g)===p.id),recs=S.recurring.filter(r=>r.pocket===p.id);
  const hasTx=allTx().some(t=>t.p===p.id);
  const needDest=v>0||bills.length||goals.length||recs.length;
  let destOpts=(goals.length?others.filter(x=>x.type==='epargne'):others).map(x=>[x.id,pName(x.id)]);
  if(needDest&&!destOpts.length){toast('Crée d\u2019abord une autre poche épargne pour y rattacher ses objectifs.');return}
  const moves=[v>0?`son solde de ${money(v)} (transfert obligatoire)`:'',bills.length?`${bills.length} échéance${bills.length>1?'s':''}`:'',goals.length?`${goals.length} objectif${goals.length>1?'s':''}`:'',recs.length?`${recs.length} revenu${recs.length>1?'s':''} automatique${recs.length>1?'s':''}`:''].filter(Boolean);
  const s=sheet(`<h2>Supprimer ${esc(pName(p.id))}</h2>
    <p class="sub">${hasTx?'Ses anciennes opérations restent dans ton historique et tes statistiques, avec la mention « Poche supprimée ».':'Cette poche n\u2019a aucune opération : elle sera simplement supprimée.'}</p>
    <form novalidate>
    ${needDest?`<p class="hint" style="margin:0 0 12px">Avant la suppression, on rattache à une autre poche : ${moves.join(', ')}.</p>${F.select('dest','Vers la poche',destOpts,destOpts[0][0])}`:''}
    ${hasTx?`<label class="check"><input type="checkbox" name="ok"><span>J'ai compris : la poche est supprimée définitivement, son historique est conservé.</span></label><em class="err" data-err="ok"></em>`:''}
    <button class="btn danger block" type="submit">Supprimer définitivement</button></form>`);
  const f=s.querySelector('form');
  f.addEventListener('submit',e=>{
    e.preventDefault();
    if(hasTx&&!f.ok.checked){setErr(f,'ok','Coche la case pour confirmer.');return}
    const dest=needDest?f.querySelector('[name=dest]').value:null;
    if(v>0&&!addTransfer(p.id,dest,v,today(),`Virement vers ${pName(dest)}`,`Virement depuis ${pName(p.id)}`))return;
    if(dest){
      goals.forEach(g=>g.pocket=dest);
      bills.forEach(b=>b.pocket=dest);recs.forEach(r=>r.pocket=dest);
    }
    S.removedPockets=S.removedPockets||{};S.removedPockets[p.id]=p.type;
    S.pockets=S.pockets.filter(x=>x.id!==p.id);
    Store.core();closeSheet();
    if(U.view==='pocket'&&U.pocket===p.id){U.view='pockets';U.stack=[]}
    render();toast('Poche supprimée. Son historique est conservé.');
  });
}

/* ---------- Statistiques : le détail s'ouvre au toucher ---------- */
function openStatDetail(k){
  const {r,p,m,pm}=statRange();
  const head=`<h2>${M_LABEL[k]}</h2><p class="sub">${esc(r.label)}</p><div class="sheet-amt num">${money(m[k])}</div><div class="cmp-one">${evoHTML(m[k],pm[k],GOOD_UP[k],'mid')}<span class="s">${esc(PREV_TITLE[U.anMode].toLowerCase())} (${money(pm[k])})</span></div>`;
  const inR=t=>t.d>=r.from&&t.d<=r.to;
  if(k==='revenus'){
    const l=allTx().filter(t=>inR(t)&&t.k==='revenu'&&t.a>0);
    sheet(`${head}${l.length?txGroups(l):'<p class="empty">Aucun revenu sur cette période.</p>'}`);return;
  }
  if(k==='depenses'){
    const list=catBreakdown(r.from,r.to),tot=list.reduce((s,x)=>s+x.total,0);
    sheet(`${head}${list.length?`<div class="list">${list.map(c=>`<button class="cat" data-a="catDetail" data-id="${esc(c.id)}"><span class="mid"><span class="t">${esc(c.id==='none'?'Sans catégorie':catName(c.id))}</span><span class="thin" style="display:block"><i style="width:${(c.total/tot*100).toFixed(1)}%"></i></span></span><span style="text-align:right"><span class="t num" style="display:block">${money(c.total)}</span><span class="s">${fmtPct(c.total/tot*100)}</span></span></button>`).join('')}</div>`:'<p class="empty">Aucune dépense sur cette période.</p>'}`);return;
  }
  // Épargne : évolution sur les 6 dernières périodes
  const bars=[];let a=U.anAnchor;
  for(let i=0;i<6;i++){const rr=rangeFor(U.anMode,a);bars.unshift({label:U.anMode==='year'?rr.from.slice(0,4):U.anMode==='month'?MONTH_ABBR[parseISO(rr.from).getMonth()]:dShort(rr.from),v:metrics(rr.from,rr.to).epargne});a=shiftAnchor(U.anMode,a,-1)}
  const max=Math.max(1,...bars.map(b=>Math.abs(b.v))),total=savingPockets().reduce((s,x)=>s+balance(x.id),0);
  sheet(`${head}<div class="ebars" role="img" aria-label="Épargne sur les 6 dernières périodes">${bars.map((b,i)=>`<div class="eb${i===5?' cur':''}"><span class="n">${b.v?money(b.v).replace(/,00/,''):''}</span><i style="height:${Math.max(3,Math.abs(b.v)/max*100).toFixed(0)}%"></i><span class="l">${esc(b.label)}</span></div>`).join('')}</div>
    ${kv('Total sur tes poches épargne',money(total))}`);
}
function openCatDetail(cid){

const Sound={
  ctx:null,fxG:null,
  ok(){
    if(!this.ctx){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
      try{this.ctx=new C()}catch(e){return false}
      this.fxG=this.ctx.createGain();this.fxG.gain.value=S.settings.soundVol;this.fxG.connect(this.ctx.destination);
    }
    if(this.ctx.state!=='running')this.ctx.resume().catch(()=>{});
    return true;
  },
  setVol(which,v){if(!this.ctx||which!=='fx')return;this.fxG.gain.setTargetAtTime(v,this.ctx.currentTime,0.05)},
  tone(out,freq,t,{dur=2,vol=0.2,type='sine',attack=0.01,partials=[[1,1]]}={}){
    const c=this.ctx,g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(out);
    for(const [mul,amp] of partials){const o=c.createOscillator();o.type=type;o.frequency.value=freq*mul;const pg=c.createGain();pg.gain.value=amp;o.connect(pg);pg.connect(g);o.start(t);o.stop(t+dur+0.05)}
  },
  fx(name){
    if(!name||name==='aucun'||!S||!this.ok())return;
    const c=this.ctx,o=this.fxG,t=c.currentTime+0.02;

    else if(name==='goutte'){for(const [dt,f0,v] of [[0,1500,0.3],[0.16,1900,0.13]]){const os=c.createOscillator(),g=c.createGain();os.frequency.setValueAtTime(f0,t+dt);os.frequency.exponentialRampToValueAtTime(f0*0.38,t+dt+0.12);g.gain.setValueAtTime(0.0001,t+dt);g.gain.linearRampToValueAtTime(v,t+dt+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.18);os.connect(g);g.connect(o);os.start(t+dt);os.stop(t+dt+0.2)}}
    else if(name==='cloche'){this.tone(o,880,t,{dur:2.6,vol:0.2,attack:0.004,partials:[[1,1],[2.76,0.45],[5.4,0.25],[8.93,0.12]]})}

function authMsg(error){
  const m=String((error&&error.message)||error||'').toLowerCase();
  if(m.includes('invalid login'))return 'E-mail ou mot de passe incorrect.';
  if(m.includes('not confirmed'))return 'Confirme d\u2019abord ton adresse e-mail (pense à regarder dans les spams).';
  if(m.includes('already registered')||m.includes('already been registered')||m.includes('already exists'))return 'Un compte existe déjà avec cet e-mail. Connecte-toi.';
  if(m.includes('rate limit')||m.includes('too many')||m.includes('security purposes'))return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(m.includes('weak')||(m.includes('password')&&m.includes('least')))return 'Mot de passe trop court ou trop simple.';
  if(m.includes('fetch')||m.includes('network')||m.includes('load failed'))return 'Pas de connexion internet.';
  return 'Une erreur est survenue. Réessaie dans un instant.';
}
async function initOnline(){
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(/type=recovery/.test(location.hash+location.search))recovering=true;
  SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  Store.sb=SB;Store.mode='supabase';
  SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;showAuth('newpass')}});
  let session=null;
  try{const r=await SB.auth.getSession();session=r.data.session}catch(e){console.warn(e)}
  const boot=$('#boot');if(boot)boot.remove();
  if(recovering){showAuth('newpass');return}
  if(!session){showAuth('welcome');return}
  await enterWith(session.user);
}
async function enterWith(user){
  ACCOUNT=user;Store.uid=user.id;
  let data;
  try{data=await Store.loadOnline()}
  catch(e){console.warn(e);showAuth('signin',{msg:'Impossible de charger tes données. Vérifie ta connexion internet, puis reconnecte-toi.'});return}
  if(location.hash.includes('access_token')||location.search.includes('code='))history.replaceState(null,'',appUrl());
  let resetPin=false;try{resetPin=localStorage.getItem('serenite-reset-pin')==='1';localStorage.removeItem('serenite-reset-pin')}catch(e){}
  if(resetPin&&data.core&&data.core.settings)Object.assign(data.core.settings,{pinHash:null,pinSalt:null,bio:null});
  startApp(data.core,data.tx,{name:(user.user_metadata&&user.user_metadata.first_name)||''});
  if(resetPin){Store.core();toast('Code supprimé. Tu peux en choisir un nouveau dans Réglages, puis Sécurité.')}
  if(data.fromCache)Store.pullRemote(data.cacheAt);else Store.saveCache(false);
}
function showSetupNeeded(noLib){
  const boot=$('#boot');if(boot)boot.remove();
  const el=document.createElement('div');el.id='auth';document.body.appendChild(el);
  el.innerHTML=`<div class="auth-box">${authHead()}<p class="auth-sub">${noLib?'Impossible de joindre le serveur. Vérifie ta connexion internet, puis relance l\u2019appli.':'Configuration à terminer : colle l\u2019adresse et la clé publique de ton projet Supabase dans le fichier config.js.'}</p>${noLib?'<button class="btn block" onclick="location.reload()">Réessayer</button>':''}</div>`;
}
const authHead=()=>`<h1 class="auth-brand">${logoHTML('auth-logo')}</h1>`;
const emailField=()=>`<label class="f"><span>E-mail</span><input name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false"><em class="err" data-err="email"></em></label>`;
const passField=(label,ac,name='password')=>`<label class="f"><span>${label}</span><input name="${name}" type="password" autocomplete="${ac}"><em class="err" data-err="${name}"></em></label>`;
function showAuth(scr,o={}){
  $('#tabs').hidden=true;$('#fab').hidden=true;
  let el=$('#auth');if(!el){el=document.createElement('div');el.id='auth';document.body.appendChild(el)}
  const V={
    welcome:()=>`${authHead()}<p class="auth-sub">Prends soin de ton argent, tranquillement.</p><div class="auth-actions"><button class="btn block" data-auth="signup">Créer un compte</button><button class="btn ghost block" data-auth="signin">J'ai déjà un compte</button></div>`,
    signup:()=>`${authHead()}<form class="auth-form" novalidate data-form="signup"><h2>Créer ton compte</h2>${F.text('name','Ton prénom','',{ph:'Ex. Sylvano'})}${emailField()}${passField('Mot de passe (8 caractères minimum)','new-password')}<p class="err" data-err="form"></p><button class="btn block" type="submit">Créer mon compte</button><button type="button" class="linkish auth-link" data-auth="signin">J'ai déjà un compte</button></form>`,
    signin:()=>`${authHead()}<form class="auth-form" novalidate data-form="signin"><h2>Connexion</h2>${o.msg?`<p class="auth-note">${esc(o.msg)}</p>`:''}${emailField()}${passField('Mot de passe','current-password')}<p class="err" data-err="form"></p><button class="btn block" type="submit">Se connecter</button><button type="button" class="linkish auth-link" data-auth="forgot">Mot de passe oublié ?</button><button type="button" class="linkish auth-link" data-auth="signup" style="color:var(--ink-2)">Créer un compte</button></form>`,
    check:()=>`${authHead()}<div class="auth-form"><h2>Vérifie ta boîte mail</h2><p class="auth-sub">Un e-mail de confirmation vient d'être envoyé à <b>${esc(o.email||'')}</b>. Ouvre le lien qu'il contient, puis reviens ici et connecte-toi. Pense à regarder dans les spams.</p><button class="btn block" data-auth="signin">Se connecter</button></div>`,
    forgot:()=>`${authHead()}<form class="auth-form" novalidate data-form="forgot"><h2>Mot de passe oublié</h2><p class="auth-sub" style="margin-bottom:18px">Indique ton e-mail : tu recevras un lien pour en choisir un nouveau.</p>${emailField()}<p class="err" data-err="form"></p><button class="btn block" type="submit">Recevoir le lien</button><button type="button" class="linkish auth-link" data-auth="signin">Retour à la connexion</button></form>`,
    sent:()=>`${authHead()}<div class="auth-form"><h2>E-mail envoyé</h2><p class="auth-sub">Si un compte existe pour cette adresse, un lien vient d'être envoyé. Ouvre-le pour choisir un nouveau mot de passe.</p><button class="btn block" data-auth="signin">Retour à la connexion</button></div>`,
    newpass:()=>`${authHead()}<form class="auth-form" novalidate data-form="newpass"><h2>Nouveau mot de passe</h2>${passField('Nouveau mot de passe (8 caractères minimum)','new-password')}${passField('Confirme le mot de passe','new-password','password2')}<p class="err" data-err="form"></p><button class="btn block" type="submit">Enregistrer</button></form>`
  };
  el.innerHTML=`<div class="auth-box">${(V[scr]||V.welcome)()}</div>`;
  const first=el.querySelector('input');if(first&&matchMedia('(pointer:fine)').matches)first.focus();
  el.onclick=e=>{const b=e.target.closest('[data-auth]');if(b){e.preventDefault();showAuth(b.dataset.auth)}};
  const f=el.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();submitAuth(f.dataset.form,f)};
}
async function submitAuth(kind,f){
  const d=readForm(f),btn=f.querySelector('[type=submit]');
  const email=(d.email||'').trim().toLowerCase();
  let ok=true;
  if('email' in d)ok=setErr(f,'email',/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)?'':'Adresse e-mail invalide.')&&ok;
  if(kind==='signup')ok=setErr(f,'name',d.name?'':'Indique ton prénom.')&&ok;
  if(kind==='signup'||kind==='newpass')ok=setErr(f,'password',(d.password||'').length>=8?'':'8 caractères minimum.')&&ok;
  if(kind==='signin')ok=setErr(f,'password',d.password?'':'Indique ton mot de passe.')&&ok;
  if(kind==='newpass')ok=setErr(f,'password2',d.password===d.password2?'':'Les deux mots de passe sont différents.')&&ok;
  if(!ok)return;
  setErr(f,'form','');btn.disabled=true;const label=btn.textContent;btn.textContent='Un instant…';
  try{
    if(kind==='signup'){
      const {data,error}=await SB.auth.signUp({email,password:d.password,options:{data:{first_name:d.name.slice(0,30)},emailRedirectTo:appUrl()}});
      if(error)throw error;
      if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)throw new Error('already registered');
      if(data.session)return enterWith(data.user);
      return showAuth('check',{email});
    }
    if(kind==='signin'){
      const {data,error}=await SB.auth.signInWithPassword({email,password:d.password});
      if(error)throw error;
      return enterWith(data.user);
    }
    if(kind==='forgot'){
      const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:appUrl()});
      if(error)throw error;
      return showAuth('sent');
    }
    if(kind==='newpass'){
      const {data,error}=await SB.auth.updateUser({password:d.password});
      if(error)throw error;
      recovering=false;history.replaceState(null,'',appUrl());
      toast('Mot de passe enregistré.');
      return enterWith(data.user);
    }
  }catch(e){setErr(f,'form',authMsg(e))}
  finally{if(btn.isConnected){btn.disabled=false;btn.textContent=label}}
}
async function waitSync(ms=5000){
  Store.now();const t0=Date.now();
  while((Store.busy||Store.dirtyCore||Store.months.size)&&Date.now()-t0<ms)await new Promise(r=>setTimeout(r,150));
  return !(Store.dirtyCore||Store.months.size||Store.pending);
}
async function logout(global){
  if(!SB)return;
  if(!await ask(global?'Déconnecter tous tes appareils ?':'Se déconnecter ?','Tes données restent enregistrées dans ton compte.',{ok:'Se déconnecter'}))return;
  const synced=await waitSync();
  if(!synced&&!await ask('Changements non synchronisés','Certains changements n\u2019ont pas encore été envoyés (pas de connexion ?). Si tu te déconnectes maintenant, ils seront perdus.',{ok:'Me déconnecter quand même',danger:true}))return;
  try{await SB.auth.signOut(global?{scope:'global'}:undefined)}catch(e){}
  Store.clearCache();location.replace(appUrl());
}
function openChangePass(){
  const s=sheet(`<h2>Changer de mot de passe</h2><form novalidate>${passField('Nouveau mot de passe (8 caractères minimum)','new-password')}${passField('Confirme le mot de passe','new-password','password2')}<p class="err" data-err="form"></p><button class="btn block" type="submit">Enregistrer</button></form>`);
  const f=s.querySelector('form');
  f.addEventListener('submit',async e=>{
    e.preventDefault();const d=readForm(f);
    if(!(setErr(f,'password',(d.password||'').length>=8?'':'8 caractères minimum.')&setErr(f,'password2',d.password===d.password2?'':'Les deux mots de passe sont différents.')))return;
    const {error}=await SB.auth.updateUser({password:d.password});
    if(error){setErr(f,'form',authMsg(error));return}
    closeSheet();toast('Mot de passe modifié.');
  });
}
async function deleteAccount(){
  if(!SB)return;
  if(!await ask('Supprimer ton compte ?','Toutes tes données seront effacées définitivement : poches, échéances, objectifs, historique. Pense à faire une sauvegarde avant.',{ok:'Continuer',danger:true}))return;
  if(!await ask('Dernière confirmation','Cette action est définitive.',{ok:'Supprimer mon compte',danger:true}))return;
  const {error}=await SB.rpc('serenite_delete_account');
  if(error){toast('Suppression impossible pour l\u2019instant. Réessaie plus tard.');return}
  try{await SB.auth.signOut()}catch(e){}
  Store.clearCache();location.replace(appUrl());
}
window.addEventListener('online',()=>{if(Store.mode==='supabase')Store.now()});


/* ---------- Code oublié : on se reconnecte avec l'e-mail et le mot de passe ---------- */
async function forgotPin(){
  if(!await ask('Code oublié ?','Tu vas être déconnecté. Reconnecte-toi avec ton e-mail et ton mot de passe : ton code sera supprimé et tu pourras en choisir un nouveau.',{ok:'Me reconnecter'}))return;
  try{localStorage.setItem('serenite-reset-pin','1')}catch(e){}
  await waitSync(3000);
  try{await SB.auth.signOut()}catch(e){}
  Store.clearCache();location.replace(appUrl());
}

/* ---------- Gestion des accès (partage en lecture seule, protégé par Supabase) ---------- */
let SELF=null,sharesLoading=false;
const isMissingTable=e=>/does not exist|schema cache|PGRST205|42P01/i.test(String((e&&e.message)||'')+String((e&&e.code)||''));
async function loadShares(){
  if(sharesLoading||!SB||!ACCOUNT)return;sharesLoading=true;
  try{
    const r=await SB.from('serenite_shares').select('id,owner_id,owner_name,viewer_email,permission,created_at,last_seen_at').order('created_at',{ascending:true});
    if(r.error)throw r.error;
    const rows=r.data||[];
    U.shares={mine:rows.filter(x=>x.owner_id===ACCOUNT.id),withMe:rows.filter(x=>x.owner_id!==ACCOUNT.id)};
  }catch(e){U.shares={mine:[],withMe:[],error:isMissingTable(e)?'missing':'net'}}
  sharesLoading=false;
  if(U.view==='settings'&&U.setCat==='share')render();
}
function shareSettingsHTML(grp,row){
  if(Store.mode!=='supabase'||!ACCOUNT)return grp(row('Gestion des accès','','Disponible dans la version en ligne, avec un compte Poka.'));
  if(!U.shares){loadShares();return '<p class="empty">Chargement…</p>'}
  const sh=U.shares;
  if(sh.error==='missing')return grp(row('Une étape à faire dans Supabase','','Le partage doit d\u2019abord être activé : lance le fichier « supabase-partage.sql » dans SQL Editor, puis reviens ici.'))+'<div class="center"><button class="linkish" data-a="shareReload">Réessayer</button></div>';
  if(sh.error)return grp(row('Impossible de charger les accès','','Vérifie ta connexion internet.'))+'<div class="center"><button class="linkish" data-a="shareReload">Réessayer</button></div>';
  const seen=x=>x.last_seen_at?`, consulté ${timeAgo(Date.parse(x.last_seen_at))}`:', pas encore consulté';
  return `<h3 class="grp">Propriétaire</h3>${grp(row('Toi','',`${esc(ACCOUNT.email||'')}, tous les droits`))}
  <h3 class="grp">Personnes autorisées</h3>
  ${sh.mine.length?grp(sh.mine.map(x=>row(esc(x.viewer_email),`<button class="mini" data-a="shareRemove" data-id="${x.id}" style="color:var(--bad)">Retirer</button>`,`Consultation, lecture seule${seen(x)}`)).join('')):'<p class="empty">Personne n\u2019a accès à tes comptes.</p>'}
  <div style="margin:14px 0 6px"><button class="btn wide" data-a="shareAdd">+ Ajouter une personne</button></div>
  <h3 class="grp">Comptes partagés avec toi</h3>
  ${sh.withMe.length?grp(sh.withMe.map(x=>row(esc(x.owner_name||'Un proche'),`<button class="mini" data-a="viewOwner" data-id="${x.owner_id}">Consulter</button>`,'Lecture seule')).join('')):'<p class="empty">Personne ne t\u2019a encore donné accès à ses comptes.</p>'}
  <p class="s" style="margin:12px 4px 0">Une personne autorisée peut tout consulter mais ne peut rien modifier. Cette règle est vérifiée par la base de données elle-même, pas seulement par l'appli.</p>`;
}
function openShareAdd(){
  const s=sheet(`<h2>Ajouter une personne</h2><p class="sub">Elle pourra consulter tes comptes, tes échéances et ton historique, sans pouvoir rien modifier. Elle doit avoir (ou créer) un compte Poka avec cette adresse e-mail.</p><form novalidate>
    <label class="f"><span>Adresse e-mail</span><input name="email" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="prenom.nom@gmail.com"><em class="err" data-err="email"></em></label>
    ${F.select('perm','Autorisation',[['read','Consultation (lecture seule)']],'read')}
    <p class="err" data-err="form"></p>
    <button class="btn block" type="submit">Autoriser</button></form>`);
  const f=s.querySelector('form');
  f.addEventListener('submit',async e=>{
    e.preventDefault();const email=(f.email.value||'').trim().toLowerCase();
    if(!setErr(f,'email',/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)?'':'Adresse e-mail invalide.'))return;
    if(ACCOUNT&&email===(ACCOUNT.email||'').toLowerCase()){setErr(f,'email','C\u2019est ta propre adresse.');return}
    const btn=f.querySelector('[type=submit]');btn.disabled=true;
    const r=await SB.from('serenite_shares').insert({owner_id:ACCOUNT.id,owner_name:(S.settings.name||'').trim()||null,viewer_email:email,permission:'read'});
    btn.disabled=false;
    if(r.error){setErr(f,'form',r.error.code==='23505'||/duplicate/i.test(r.error.message||'')?'Cette personne a déjà accès.':isMissingTable(r.error)?'Le partage n\u2019est pas encore activé : lance le fichier SQL de partage dans Supabase.':'Impossible d\u2019ajouter cette personne pour l\u2019instant.');return}
    closeSheet();U.shares=null;render();toast(`${email} peut maintenant consulter tes comptes.`);
  });
}
async function removeShare(id){
  const x=U.shares&&U.shares.mine.find(y=>y.id===id);
  if(!await ask('Retirer l\u2019accès ?',x?`${x.viewer_email} ne pourra plus consulter tes comptes.`:'',{ok:'Retirer',danger:true}))return;
  const r=await SB.from('serenite_shares').delete().eq('id',id);
  if(r.error){toast('Impossible de retirer l\u2019accès pour l\u2019instant.');return}
  U.shares=null;render();toast('Accès retiré.');
}
async function enterView(ownerId){
  const sh=U.shares&&U.shares.withMe.find(x=>x.owner_id===ownerId),name=(sh&&sh.owner_name)||'ton proche';
  await waitSync(3000);
  try{
    const c=await SB.from('serenite_core').select('data').eq('user_id',ownerId).maybeSingle();
    const t=await SB.from('serenite_tx').select('month,items').eq('user_id',ownerId);
    if(c.error||t.error)throw (c.error||t.error);
    if(!c.data){toast('Cette personne n\u2019a pas encore configuré Poka.');return}
    const tx={};for(const r of t.data||[])if(Array.isArray(r.items)&&r.items.length)tx[r.month]=r.items;
    SELF={S,TX};
    const own=normalize(c.data.data),mine=clone(SELF.S.settings);
    ['theme','accent','animations','amb','sound','soundVol','privacyBlur','discreetStart','pinHash','pinSalt','pinLen','bio','autolock','notif','dailyTime','name'].forEach(k=>own.settings[k]=mine[k]);
    Store.readOnly=true;S=own;TX=tx;_all=null;
    U.viewing={ownerId,name};U.stack=[];U.view='home';U.discreet=false;
    generate();applyTheme();render();window.scrollTo(0,0);
    SB.rpc('serenite_touch_share',{p_owner:ownerId}).then(()=>{},()=>{});
  }catch(e){toast('Accès impossible pour l\u2019instant. La personne a peut-être retiré ton accès.')}
}
function exitView(){
  if(!SELF){U.viewing=null;render();return}
  S=SELF.S;TX=SELF.TX;SELF=null;_all=null;U.viewing=null;Store.readOnly=false;
  U.view='home';U.stack=[];U.shares=null;applyTheme();render();window.scrollTo(0,0);toast('Tu es de retour sur ton compte.');
}
function renderViewBar(){
  let b=$('#viewbar');
  if(!U.viewing){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='viewbar';document.body.appendChild(b)}
  b.innerHTML=`<span>Lecture seule</span><button data-a="exitView">Revenir à mon compte</button>`;
}
ACT.shareReload=()=>{U.shares=null;render()};
init();
