    ${has?F.pin('cur','Code actuel'):''}${F.pin('p1',has?'Nouveau code':'Code')}${F.pin('p2','Confirme le code')}
    <button class="btn block" type="submit">${has?'Changer le code':'Activer le code'}</button>
    ${has?'<button class="btn quiet block mt" type="button" data-off>Désactiver le code</button>':''}</form>`);
  const f=s.querySelector('form');
  const checkCur=async()=>{if(!has)return true;const h=await hashPin(f.cur.value,S.settings.pinSalt);return setErr(f,'cur',h===S.settings.pinHash?'':'Code actuel incorrect.')};
  f.addEventListener('submit',async e=>{
    e.preventDefault();if(!await checkCur())return;

    if(!setErr(f,'p1',/^\d{4,6}$/.test(p1)?'':'Entre 4 à 6 chiffres.'))return;
    if(!setErr(f,'p2',p1===p2?'':'Les deux codes sont différents.'))return;
    const salt=b64(crypto.getRandomValues(new Uint8Array(12)));
    S.settings.pinSalt=salt;S.settings.pinHash=await hashPin(p1,salt);S.settings.pinLen=p1.length;
    Store.core();closeSheet();render();toast(has?'Code modifié.':'Code PIN activé.');
  });
  const off=s.querySelector('[data-off]');
  if(off)off.onclick=async()=>{if(!await checkCur())return;S.settings.pinHash=null;S.settings.pinSalt=null;S.settings.bio=null;Store.core();closeSheet();render();toast('Code PIN désactivé.')};
}
async function bioEnable(){
  try{

    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Sérénité'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'serenite',displayName:'Sérénité'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000,attestation:'none'}});
    S.settings.bio=b64(cred.rawId);Store.core();toast('Face ID / Touch ID activé.');return true;
  }catch(e){toast('Face ID / Touch ID n\u2019est pas autorisé dans cet affichage. Ton code PIN reste actif.');return false}

async function key(k){
  if(!locked)return;
  if(Date.now()<lockUntil)return;
  if(k==='bio')return bioUnlock();
  if(k==='del'){pinBuf=pinBuf.slice(0,-1);paintDots();return}
  if(pinBuf.length>=(S.settings.pinLen||4))return;
  pinBuf+=k;paintDots();
  if(pinBuf.length===(S.settings.pinLen||4)){
    const h=await hashPin(pinBuf,S.settings.pinSalt);
    if(h===S.settings.pinHash){fails=0;unlock()}
    else{
      fails++;pinBuf='';const d=$('#dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');setTimeout(paintDots,200);
      $('#lockMsg').textContent='Code incorrect';
      if(fails>=5){lockUntil=Date.now()+30000;$('#lockHelp').textContent='Trop d\u2019essais. Réessaie dans 30 secondes. Code oublié : demande à Claude de le réinitialiser dans la conversation où l\u2019appli a été créée.';setTimeout(()=>{const h2=$('#lockHelp');if(h2)h2.textContent=''},30000)}
    }
  }
}
function unlock(){locked=false;pinBuf='';lastActive=Date.now();const el=$('#lock');if(el)el.remove();runChecks();render();afterEntry()}
document.addEventListener('keydown',e=>{
  if(locked){if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');return}
  if(e.key==='Escape'){const c=$('.scrim.confirm');if(c)return;closeSheet()}
  if(e.key==='Enter'&&e.target.matches('[role=button]'))e.target.click();
});
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{lastActive=Date.now()},{passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(!S)return;
  if(document.hidden){hiddenAt=Date.now();Store.now()}
  else{
    const al=+S.settings.autolock;
    if(S.settings.pinHash&&al>0&&hiddenAt&&Date.now()-hiddenAt>al*60000)lockNow();
    runChecks();if(!locked)softRender();
  }
});
window.addEventListener('pagehide',()=>{if(S)Store.now()});
setInterval(()=>{
  if(!S||locked)return;
  const al=+S.settings.autolock;
  if(S.settings.pinHash&&al>0&&Date.now()-lastActive>al*60000){lockNow();return}
},20000);

/* ---------- Musique d'ambiance : quelques notes de piano (générées, libres de droits) ---------- */
const Sound={
  ctx:null,ambG:null,fxG:null,rev:null,stopFn:null,
  ok(){
    if(!this.ctx){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
      try{this.ctx=new C()}catch(e){return false}
      const c=this.ctx;
      this.ambG=c.createGain();this.ambG.gain.value=S.settings.amb.vol*0.9;this.ambG.connect(c.destination);
      this.fxG=c.createGain();this.fxG.gain.value=S.settings.soundVol;this.fxG.connect(c.destination);
      this.rev=c.createConvolver();this.rev.buffer=this.ir(4.2);
      const rg=c.createGain();rg.gain.value=0.55;this.rev.connect(rg);rg.connect(this.ambG);
    }
    if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});
    return true;
  },
  /* Réverbération douce et sombre : du bruit filtré qui s'éteint lentement */
  ir(sec){
    const c=this.ctx,len=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){
      const d=b.getChannelData(ch);let y=0;
      for(let i=0;i<len;i++){const p=i/len,k=0.55-0.5*p;y+=k*((Math.random()*2-1)-y);d[i]=y*Math.pow(1-p,3.2)*(i<c.sampleRate*0.012?i/(c.sampleRate*0.012):1)}
    }
    return b;
  },
  /* Une note de piano : cordes légèrement désaccordées, harmoniques qui s'éteignent vite, attaque feutrée */
  note(out,freq,t,vel=0.12,len=5){
    const c=this.ctx,B=0.00035;
    const env=c.createGain();env.gain.setValueAtTime(0.0001,t);env.gain.linearRampToValueAtTime(vel,t+0.006);env.gain.exponentialRampToValueAtTime(vel*0.35,t+0.9);env.gain.exponentialRampToValueAtTime(0.0001,t+len);
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.Q.value=0.3;lp.frequency.setValueAtTime(Math.min(7000,freq*7),t);lp.frequency.exponentialRampToValueAtTime(Math.max(500,freq*1.6),t+2.2);
    lp.connect(env);env.connect(out);
    const parts=[[1,1],[2,0.38],[3,0.14],[4,0.07],[5,0.035],[6,0.018]];
    for(const [n,amp] of parts){
      const f=freq*n*Math.sqrt(1+B*n*n);
      for(const det of n===1?[-1.2,1.2]:[0]){
        const o=c.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=det;
        const g=c.createGain();const dec=Math.max(0.6,len/Math.pow(n,0.8));
        g.gain.setValueAtTime(amp*(n===1?0.5:1),t);g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
        o.connect(g);g.connect(lp);o.start(t);o.stop(t+dec+0.05);
      }
    }
  },
  startAmb(type){
    if(!this.ok())return;this.stopAmb();
    const c=this.ctx,bus=c.createGain(),wet=c.createGain(),mix=c.createGain();
    bus.gain.setValueAtTime(0.0001,c.currentTime);bus.gain.linearRampToValueAtTime(0.75,c.currentTime+2);bus.connect(this.ambG);
    wet.gain.value=0.75;wet.connect(this.rev);mix.connect(bus);mix.connect(wet);
    const P={
      doux:{scale:[261.63,293.66,329.63,392,440,523.25,587.33,659.25],root:[130.81,196],gap:[3200,6400],vel:[0.09,0.14]},
      matin:{scale:[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99],root:[146.83,220],gap:[2600,5200],vel:[0.08,0.12]},
      soir:{scale:[220,261.63,293.66,329.63,392,440,523.25],root:[110,164.81],gap:[4200,8200],vel:[0.08,0.12]}
    }[type]||null;
    const cfg=P||{scale:[261.63,293.66,329.63,392,440,523.25],root:[130.81],gap:[3200,6400],vel:[0.09,0.14]};
    let idx=Math.floor(cfg.scale.length/2),count=0,alive=true,timer=null;
    const rnd=(a,b)=>a+Math.random()*(b-a);
    const play=()=>{
      if(!alive)return;
      const t=c.currentTime+0.05;
      idx=Math.max(0,Math.min(cfg.scale.length-1,idx+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));
      this.note(mix,cfg.scale[idx],t,rnd(cfg.vel[0],cfg.vel[1]),6);
      if(Math.random()<0.22){const j=Math.max(0,idx-2);this.note(mix,cfg.scale[j],t+0.28,cfg.vel[0]*0.8,6)}
      if(count%4===0)this.note(mix,cfg.root[Math.floor(Math.random()*cfg.root.length)],t,cfg.vel[0]*0.7,7);
      count++;
      const rest=Math.random()<0.18?rnd(2500,4500):0;
      timer=setTimeout(play,rnd(cfg.gap[0],cfg.gap[1])+rest);
    };
    timer=setTimeout(play,500);
    this.stopFn=()=>{alive=false;clearTimeout(timer);const t=c.currentTime;bus.gain.cancelScheduledValues(t);bus.gain.setValueAtTime(bus.gain.value,t);bus.gain.linearRampToValueAtTime(0.0001,t+1.5);wet.gain.setTargetAtTime(0,t,0.5);setTimeout(()=>{try{bus.disconnect();wet.disconnect()}catch(x){}},4000)};
  },
  stopAmb(){if(this.stopFn){this.stopFn();this.stopFn=null}},
  setVol(which,v){if(!this.ctx)return;const g=which==='amb'?this.ambG:this.fxG;g.gain.setTargetAtTime(which==='amb'?v*0.9:v,this.ctx.currentTime,0.05)},
  tone(out,freq,t,{dur=2,vol=0.2,type='sine',attack=0.01,partials=[[1,1]]}={}){
    const c=this.ctx,g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(out);
    for(const [mul,amp] of partials){const o=c.createOscillator();o.type=type;o.frequency.value=freq*mul;const pg=c.createGain();pg.gain.value=amp;o.connect(pg);pg.connect(g);o.start(t);o.stop(t+dur+0.05)}
  },
  fx(name){
    if(!name||name==='aucun'||!S||!this.ok())return;
    const c=this.ctx,o=this.fxG,t=c.currentTime+0.02;
    if(name==='doux'){this.tone(o,659.25,t,{dur:0.9,vol:0.22,attack:0.02,partials:[[1,1],[2,0.15]]});this.tone(o,987.77,t+0.16,{dur:1.1,vol:0.18,attack:0.02,partials:[[1,1],[2,0.15]]})}
    else if(name==='piano'){[523.25,659.25,783.99].forEach((f,i)=>this.note(o,f,t+i*0.13,0.22,1.8))}
    else if(name==='goutte'){for(const [dt,f0,v] of [[0,1500,0.3],[0.16,1900,0.13]]){const os=c.createOscillator(),g=c.createGain();os.frequency.setValueAtTime(f0,t+dt);os.frequency.exponentialRampToValueAtTime(f0*0.38,t+dt+0.12);g.gain.setValueAtTime(0.0001,t+dt);g.gain.linearRampToValueAtTime(v,t+dt+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.18);os.connect(g);g.connect(o);os.start(t+dt);os.stop(t+dt+0.2)}}
    else if(name==='cloche'){this.tone(o,880,t,{dur:2.6,vol:0.2,attack:0.004,partials:[[1,1],[2.76,0.45],[5.4,0.25],[8.93,0.12]]})}
  }
};

async function saveFile(name,data,mime){
  if(DL){
    try{const r=await DL.save({filename:name,data});if(r&&r.status==='saved')toast('Fichier enregistré.')}
    catch(e){const code=e&&e.code;if(code==='declined')return;toast(code==='rate_limited'?'Un enregistrement est déjà en cours.':'Enregistrement impossible dans cet affichage.')}
    return;
  }
  try{const blob=data instanceof Blob?data:new Blob([data],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
  catch(e){toast('Enregistrement impossible.')}
}
function csvHistory(){
  const q=v=>{const s=String(v??'');return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const head=['Date','Type','Montant','Motif','Lieu','Catégorie','Sous-catégorie','Solde concerné','Objectif'];
  const rows=allTx().slice().reverse().map(t=>{const c=catById(t.c),p=c&&c.p?catById(c.p):null;const g=t.g?goalById(t.g):null;return [t.d,KIND[t.k]||t.k,(t.a/100).toFixed(2).replace('.',','),t.l||'',t.w||'',p?p.n:(c?c.n:''),p?c.n:'',pName(t.p),g?g.name:'']});
  return '\ufeff'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n');
}

async function makePDF(period){
  toast('Préparation du PDF…');
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')}catch(e){toast('Impossible de charger le module PDF. Vérifie ta connexion.');return}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
  const P=s=>String(s).replace(/[\u202f\u00a0]/g,' ').replace(/\u2212/g,'-').replace(/[\u2019]/g,"'");
  const L=16,R=194;let y=20;
  const ink=[51,64,74],grey=[102,114,124];
  const put=(s,x,o={})=>{doc.setFont('helvetica',o.bold?'bold':'normal');doc.setFontSize(o.size||10);doc.setTextColor(...(o.color||ink));doc.text(P(s),x,y,o.align?{align:o.align}:undefined)};
  const ensure=h=>{if(y+h>282){doc.addPage();y=20}};
  const line=(l,r,o={})=>{ensure(6);put(l,L+(o.indent||0),o);put(r,R,Object.assign({},o,{align:'right'}));y+=6};
  const h=s=>{ensure(16);y+=5;put(s,L,{size:13,bold:true});y+=2.5;doc.setDrawColor(205,210,214);doc.line(L,y,R,y);y+=6};
  const cut=(s,n)=>{s=P(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
  put('Sérénité',L,{size:22,bold:true});y+=7;put('Relevé du '+dLong(today()),L,{color:grey});y+=4;
  const f=forecast();
  h('Soldes');activePockets().forEach(p=>line(pName(p.id),money(balance(p.id))));line('Total',money(f.total),{bold:true});line(`Disponible réel (jusqu'au ${dLong(f.h)})`,money(f.dispo),{bold:true});
  h('Échéances à payer');const td=todoOcc();if(!td.length)line('Aucune échéance à payer','');td.forEach(o=>line(`${cut(billName(o),60)}, ${dShort(o.due)}${o.due<today()?' (en retard)':''}`,money(o.amount)));
  const loans=S.bills.filter(b=>b.type==='credit'&&!b.deleted);
  if(loans.length){h('Crédits');loans.forEach(b=>{const s=loanStats(b);line(`${cut(b.name,40)}${b.loan&&b.loan.ref?' (réf. '+cut(b.loan.ref,20)+')':''}`,`reste ${money(s.remaining)} sur ${money(s.total)}`)})}
  if(S.goals.length){h("Objectifs d'épargne");S.goals.forEach(g=>{const sv=Math.max(0,goalSaved(g.id));line(cut(g.name,50),`${money(sv)} / ${money(g.target)} (${fmtPct(g.target?Math.min(100,sv/g.target*100):0)})`)})}
  const t=today();let from,to=t,label;
  if(period==='last'){from=startOfMonth(addMonths(startOfMonth(t),-1));to=endOfMonth(from);label=cap(fMonth.format(parseISO(from)))}
  else if(period==='3m'){from=startOfMonth(addMonths(startOfMonth(t),-2));label='Les 3 derniers mois'}
  else if(period==='year'){from=t.slice(0,4)+'-01-01';label='Année '+t.slice(0,4)}
  else if(period==='all'){from='0000-01-01';label='Tout l\u2019historique'}
  else{from=startOfMonth(t);to=endOfMonth(t);label=cap(fMonth.format(parseISO(from)))}
  const m=metrics(from,to);
  h('Résumé : '+label);line('Revenus',money(m.revenus));line('Dépenses',money(m.depenses));line('Dont échéances',money(m.echeances),{indent:4});line('Dont achats',money(m.achats),{indent:4});line('Épargne (versements nets)',money(m.epargne));line('Solde de la période',signed(m.net),{bold:true});
  h('Opérations');
  const list=allTx().filter(x=>x.d>=from&&x.d<=to);
  if(!list.length)line('Aucune opération sur cette période.','');
  else{
    ensure(8);put('Date',L,{size:9,color:grey});put('Motif',L+22,{size:9,color:grey});put('Catégorie',L+92,{size:9,color:grey});put('Solde',L+132,{size:9,color:grey});put('Montant',R,{size:9,color:grey,align:'right'});y+=6;
    list.forEach(x=>{ensure(6);put(fDY.format(parseISO(x.d)),L,{size:9});put(cut(x.l||KIND[x.k],38),L+22,{size:9});put(cut(x.c?catName(x.c):KIND[x.k],22),L+92,{size:9});put(cut(pName(x.p),18),L+132,{size:9});put(signed(x.a),R,{size:9,align:'right'});y+=5.5});
  }
  saveFile(`serenite-releve-${today()}.pdf`,doc.output('blob'),'application/pdf');
}

  income:el=>openIncome(el.dataset.id||null),withdraw:el=>openWithdraw(el.dataset.id),saveMoney:el=>openSave(el.dataset.id||''),adjust:el=>openAdjust(el.dataset.id),
  pay:el=>{const o=occById(el.dataset.id);if(o)payWithGrace(o)},
  setCat:el=>withVT(()=>{U.setCat=el.dataset.id;render();window.scrollTo(0,0)}),
  profile:openProfile,
  anDetails:()=>{U.anDetails=!U.anDetails;render()},
  cmpCats:()=>{U.cmpCats=!U.cmpCats;render()},
  ambPick:el=>{S.settings.amb.type=el.dataset.id;Store.core();if(S.settings.amb.on)Sound.startAmb(el.dataset.id);render()},
  fxPick:el=>{S.settings.sound=el.dataset.id;Store.core();Sound.fx(el.dataset.id);render()},
  occ:el=>openOcc(el.dataset.id),bill:el=>{const b=billById(el.dataset.id);if(b)openBillForm(b)},tx:el=>openTx(el.dataset.id),
  billsTab:el=>withVT(()=>{U.billsTab=el.dataset.id;render()}),
  hf:el=>{U.hf=el.dataset.id;U.histLimit=80;render()},
  more:()=>{U.histLimit+=80;$('#histList').innerHTML=histList()},
  anTab:el=>withVT(()=>{U.anTab=el.dataset.id;render()}),
  anMode:el=>{U.anMode=el.dataset.id;U.anAnchor=today();U.openCat=null;render()},
  anShift:el=>{U.anAnchor=shiftAnchor(U.anMode,U.anAnchor,+el.dataset.id);U.openCat=null;render()},
  openCat:el=>{U.openCat=U.openCat===el.dataset.id?null:el.dataset.id;render()},
  catTx:el=>openCatTx(el.dataset.id,el.dataset.from,el.dataset.to),
  notif:el=>{const n=S.notifs.find(x=>x.id===el.dataset.id);if(n&&n.go)go(n.go)},
  clearNotifs:async()=>{if(!await ask('Effacer les notifications ?','',{ok:'Effacer'}))return;S.notifs=[];Store.core();render()},
  perm:askNotifPerm,preview:()=>{Sound.fx(S.settings.sound==='aucun'?'doux':S.settings.sound)},
  pin:openPin,lockNow:()=>lockNow(),cats:openCats,
  csv:()=>saveFile(`serenite-historique-${today()}.csv`,csvHistory(),'text/csv'),
  pdf:openExport,backup,restore,reset:resetAll
};
let suppressClick=false;
document.addEventListener('click',async e=>{
  if(locked)return;
  if(suppressClick){e.preventDefault();e.stopPropagation();return}
  const tg=e.target.closest('[data-toggle]');
  if(tg){
    const p=tg.dataset.toggle;
    if(p==='bio'){if(S.settings.bio){S.settings.bio=null;Store.core();render()}else if(await bioEnable())render();return}
    setPath(p,!getPath(p));Store.core();applySetting(p);render();return;
  }
  const el=e.target.closest('[data-a],[data-go]');if(!el)return;
  if(el.dataset.a){const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el,e)}}
  else if(el.dataset.go){e.preventDefault();go(el.dataset.go)}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('[data-set]')){
    const p=el.dataset.set;let v=el.value;
    if(el.type==='range')v=(+v)/100;
    else if(NUM_SETTINGS.includes(p))v=Math.max(0,parseInt(v,10)||0);
    else if(p==='autoDelay')v=v==='custom'?'custom':+v;
    if(p==='autoCustom'&&v<1)v=1;
    setPath(p,v);Store.core();applySetting(p);if(el.type!=='range')render();
  }
  if(el.matches('[data-an]')){if(el.value){U.anCustom[el.dataset.an]=el.value;render()}}
  if(el.matches('[data-cmp]')){if(el.value){U['cmp'+el.dataset.cmp.toUpperCase()]=el.value;render()}}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){U.q=el.value;U.histLimit=80;$('#histList').innerHTML=histList()}
  if(el.matches('input[type=range][data-set]')){const v=(+el.value)/100;if(el.dataset.set==='amb.vol')Sound.setVol('amb',v);else Sound.setVol('fx',v)}
});

/* ---------- Démarrage ---------- */
const CFG=window.SERENITE_CONFIG||{};
const ONLINE=!!(CFG.supabaseUrl&&CFG.supabaseKey&&window.supabase&&!/COLLE_ICI/.test(CFG.supabaseUrl+CFG.supabaseKey));
async function init(){
  if(window.SERENITE_CONFIG){if(!window.supabase)return showSetupNeeded(true);if(!ONLINE)return showSetupNeeded(false);return initOnline()}
  const {core,tx}=await Store.init();
  startApp(core,tx);
}
let started=false,helloShown=false;
function startApp(core,tx,opts={}){
  S=normalize(core);TX=tx||{};_all=null;
  if(opts.name&&!S.settings.name)S.settings.name=opts.name;
  if(!core)Store.core();
  applyTheme();applyAnim();
  if(!started){
    $('#tabs nav').innerHTML=TABS.map(([k,l,ic])=>`<button data-go="${k}"><span>${ic}</span>${l}</button>`).join('');
    $('#fab').innerHTML=I.plus;
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S&&S.settings.theme==='auto')applyTheme()});
    const startAmb=()=>{document.removeEventListener('pointerdown',startAmb,true);if(S&&S.settings.amb.on)Sound.startAmb(S.settings.amb.type)};
    document.addEventListener('pointerdown',startAmb,true);
    setInterval(()=>{if(S&&!document.hidden&&!locked){runChecks();if(U.view==='home'||U.view==='bills')softRender()}},60000);
    started=true;
  }
  $('#tabs').hidden=false;
  const boot=$('#boot');if(boot)boot.remove();
  const au=$('#auth');if(au)au.remove();
  U.view='home';U.stack=[];
  if(S.settings.discreetStart)U.discreet=true;
  if(S.settings.pinHash)lockNow();
  runChecks();render();
  if(!locked)afterEntry();
}
function afterEntry(){
  if(helloShown){if(!S.onboarded)openOnboarding();return}
  helloShown=true;
  showHello(()=>{if(!S.onboarded)openOnboarding()});
}
/* Petite animation d'arrivée : « Bonjour Sylvano », puis l'accueil apparaît */
function showHello(done){
  const name=(S.settings.name||'').trim(),h=new Date().getHours();
  const txt=(h<5||h>=18?'Bonsoir':'Bonjour')+(name?' '+name:'');
  if(!animOn()){done&&done();return}
  const el=document.createElement('div');el.id='hello';el.setAttribute('aria-hidden','true');
  el.innerHTML=`<div class="hello-in"><span class="hello-ring"></span><p>${esc(txt)}</p></div>`;
  document.body.appendChild(el);
  $('#main').classList.add('arrive');
  setTimeout(()=>{el.classList.add('out');$('#main').classList.remove('arrive')},850);
  setTimeout(()=>{el.remove();done&&done()},1250);
}


/* ---------- Confidentialité : flou en arrière-plan ---------- */
function privacyOn(){if(S&&S.settings.privacyBlur)document.body.classList.add('privacy')}
function privacyOff(){document.body.classList.remove('privacy')}
window.addEventListener('blur',privacyOn);
window.addEventListener('focus',privacyOff);
window.addEventListener('pagehide',privacyOn);
document.addEventListener('visibilitychange',()=>{if(document.hidden)privacyOn();else privacyOff()});
document.addEventListener('pointerdown',privacyOff,true);

/* ---------- Bouton + qui s'efface quand on descend ---------- */
let lastY=0;
window.addEventListener('scroll',()=>{const y=window.scrollY,fab=$('#fab');if(!fab)return;if(y>lastY+6&&y>100)fab.classList.add('away');else if(y<lastY-6||y<60)fab.classList.remove('away');lastY=y},{passive:true});

/* ---------- Glisser une échéance : droite = payé, gauche = payer plus tard ---------- */
let sw=null;
function resetSwipe(s){s.card.style.transform='';s.card.classList.remove('dragging');const w=s.card.parentElement;if(w)w.classList.remove('go-right','go-left','armed')}
document.addEventListener('pointerdown',e=>{
  if(locked)return;const card=e.target.closest('.ecard[data-swipe]');if(!card)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  sw={card,id:card.dataset.card,x0:e.clientX,y0:e.clientY,dx:0,active:false,pid:e.pointerId};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!sw||e.pointerId!==sw.pid)return;
  const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
  if(!sw.active){
    if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){sw.active=true;sw.card.classList.add('dragging');try{sw.card.setPointerCapture(e.pointerId)}catch(x){}}
    else if(Math.abs(dy)>12){sw=null;return}else return;
  }
  sw.dx=dx;const lim=Math.max(-160,Math.min(160,dx));sw.card.style.transform=`translateX(${lim}px)`;
  const w=sw.card.parentElement;w.classList.toggle('go-right',dx>0);w.classList.toggle('go-left',dx<0);w.classList.toggle('armed',Math.abs(dx)>90);
},{passive:true});
document.addEventListener('pointerup',e=>{
  if(!sw||e.pointerId!==sw.pid)return;const s=sw;sw=null;if(!s.active)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,80);
  const o=occById(s.id);resetSwipe(s);
  if(o&&Math.abs(s.dx)>90){
    if(S.settings.swipeTip){S.settings.swipeTip=false;Store.core()}
    if(s.dx>0)payWithGrace(o);else openLater(o);
  }
});
document.addEventListener('pointercancel',()=>{if(sw){resetSwipe(sw);sw=null}});


/* ---------- Comptes (version en ligne, Supabase) ---------- */
let SB=null,ACCOUNT=null,recovering=false;
const appUrl=()=>location.origin+location.pathname;
function authMsg(error){
  const m=String((error&&error.message)||error||'').toLowerCase();
  if(m.includes('invalid login'))return 'E-mail ou mot de passe incorrect.';
  if(m.includes('not confirmed'))return 'Confirme d\u2019abord ton adresse e-mail (pense à regarder dans les spams).';
  if(m.includes('already registered')||m.includes('already been registered')||m.includes('already exists'))return 'Un compte existe déjà avec cet e-mail. Connecte-toi.';
  if(m.includes('rate limit')||m.includes('too many')||m.includes('security purposes'))return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(m.includes('weak')||(m.includes('password')&&m.includes('least')))return 'Mot de passe trop court ou trop simple.';
  if(m.includes('fetch')||m.includes('network')||m.includes('load failed'))return 'Pas de connexion internet.';
  return 'Une erreur est survenue. Réessaie dans un instant.';
}
async function initOnline(){
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(/type=recovery/.test(location.hash+location.search))recovering=true;
  SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  Store.sb=SB;Store.mode='supabase';
  SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;showAuth('newpass')}});
  let session=null;
  try{const r=await SB.auth.getSession();session=r.data.session}catch(e){console.warn(e)}
  const boot=$('#boot');if(boot)boot.remove();
  if(recovering){showAuth('newpass');return}
  if(!session){showAuth('welcome');return}
  await enterWith(session.user);
}
async function enterWith(user){
  ACCOUNT=user;Store.uid=user.id;
  let data;
  try{data=await Store.loadOnline()}
  catch(e){console.warn(e);showAuth('signin',{msg:'Impossible de charger tes données. Vérifie ta connexion internet, puis reconnecte-toi.'});return}
  if(location.hash.includes('access_token')||location.search.includes('code='))history.replaceState(null,'',appUrl());
  startApp(data.core,data.tx,{name:(user.user_metadata&&user.user_metadata.first_name)||''});
  if(data.fromCache)Store.pullRemote(data.cacheAt);else Store.saveCache(false);
}
function showSetupNeeded(noLib){
  const boot=$('#boot');if(boot)boot.remove();
  const el=document.createElement('div');el.id='auth';document.body.appendChild(el);
  el.innerHTML=`<div class="auth-box">${authHead()}<p class="auth-sub">${noLib?'Impossible de joindre le serveur. Vérifie ta connexion internet, puis relance l\u2019appli.':'Configuration à terminer : colle l\u2019adresse et la clé publique de ton projet Supabase dans le fichier config.js.'}</p>${noLib?'<button class="btn block" onclick="location.reload()">Réessayer</button>':''}</div>`;
}
const authHead=()=>`<div class="auth-mark" aria-hidden="true"><span class="ring a"></span><span class="ring b"></span><span class="dot"></span></div><h1 class="auth-title">Sérénité</h1>`;
const emailField=()=>`<label class="f"><span>E-mail</span><input name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false"><em class="err" data-err="email"></em></label>`;
const passField=(label,ac,name='password')=>`<label class="f"><span>${label}</span><input name="${name}" type="password" autocomplete="${ac}"><em class="err" data-err="${name}"></em></label>`;
function showAuth(scr,o={}){
  $('#tabs').hidden=true;$('#fab').hidden=true;
  let el=$('#auth');if(!el){el=document.createElement('div');el.id='auth';document.body.appendChild(el)}
  const V={
    welcome:()=>`${authHead()}<p class="auth-sub">Prends soin de ton argent, tranquillement.</p><div class="auth-actions"><button class="btn block" data-auth="signup">Créer un compte</button><button class="btn ghost block" data-auth="signin">J'ai déjà un compte</button></div>`,
    signup:()=>`${authHead()}<form class="auth-form" novalidate data-form="signup"><h2>Créer ton compte</h2>${F.text('name','Ton prénom','',{ph:'Ex. Sylvano'})}${emailField()}${passField('Mot de passe (8 caractères minimum)','new-password')}<p class="err" data-err="form"></p><button class="btn block" type="submit">Créer mon compte</button><button type="button" class="linkish auth-link" data-auth="signin">J'ai déjà un compte</button></form>`,
    signin:()=>`${authHead()}<form class="auth-form" novalidate data-form="signin"><h2>Connexion</h2>${o.msg?`<p class="auth-note">${esc(o.msg)}</p>`:''}${emailField()}${passField('Mot de passe','current-password')}<p class="err" data-err="form"></p><button class="btn block" type="submit">Se connecter</button><button type="button" class="linkish auth-link" data-auth="forgot">Mot de passe oublié ?</button><button type="button" class="linkish auth-link" data-auth="signup" style="color:var(--ink-2)">Créer un compte</button></form>`,
    check:()=>`${authHead()}<div class="auth-form"><h2>Vérifie ta boîte mail</h2><p class="auth-sub">Un e-mail de confirmation vient d'être envoyé à <b>${esc(o.email||'')}</b>. Ouvre le lien qu'il contient, puis reviens ici et connecte-toi. Pense à regarder dans les spams.</p><button class="btn block" data-auth="signin">Se connecter</button></div>`,
    forgot:()=>`${authHead()}<form class="auth-form" novalidate data-form="forgot"><h2>Mot de passe oublié</h2><p class="auth-sub" style="margin-bottom:18px">Indique ton e-mail : tu recevras un lien pour en choisir un nouveau.</p>${emailField()}<p class="err" data-err="form"></p><button class="btn block" type="submit">Recevoir le lien</button><button type="button" class="linkish auth-link" data-auth="signin">Retour à la connexion</button></form>`,
    sent:()=>`${authHead()}<div class="auth-form"><h2>E-mail envoyé</h2><p class="auth-sub">Si un compte existe pour cette adresse, un lien vient d'être envoyé. Ouvre-le pour choisir un nouveau mot de passe.</p><button class="btn block" data-auth="signin">Retour à la connexion</button></div>`,
    newpass:()=>`${authHead()}<form class="auth-form" novalidate data-form="newpass"><h2>Nouveau mot de passe</h2>${passField('Nouveau mot de passe (8 caractères minimum)','new-password')}${passField('Confirme le mot de passe','new-password','password2')}<p class="err" data-err="form"></p><button class="btn block" type="submit">Enregistrer</button></form>`
  };
  el.innerHTML=`<div class="auth-box">${(V[scr]||V.welcome)()}</div>`;
  const first=el.querySelector('input');if(first&&matchMedia('(pointer:fine)').matches)first.focus();
  el.onclick=e=>{const b=e.target.closest('[data-auth]');if(b){e.preventDefault();showAuth(b.dataset.auth)}};
  const f=el.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();submitAuth(f.dataset.form,f)};
}
async function submitAuth(kind,f){
  const d=readForm(f),btn=f.querySelector('[type=submit]');
  const email=(d.email||'').trim().toLowerCase();
  let ok=true;
  if('email' in d)ok=setErr(f,'email',/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)?'':'Adresse e-mail invalide.')&&ok;
  if(kind==='signup')ok=setErr(f,'name',d.name?'':'Indique ton prénom.')&&ok;
  if(kind==='signup'||kind==='newpass')ok=setErr(f,'password',(d.password||'').length>=8?'':'8 caractères minimum.')&&ok;
  if(kind==='signin')ok=setErr(f,'password',d.password?'':'Indique ton mot de passe.')&&ok;
  if(kind==='newpass')ok=setErr(f,'password2',d.password===d.password2?'':'Les deux mots de passe sont différents.')&&ok;
  if(!ok)return;
  setErr(f,'form','');btn.disabled=true;const label=btn.textContent;btn.textContent='Un instant…';
  try{
    if(kind==='signup'){
      const {data,error}=await SB.auth.signUp({email,password:d.password,options:{data:{first_name:d.name.slice(0,30)},emailRedirectTo:appUrl()}});
      if(error)throw error;
      if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)throw new Error('already registered');
      if(data.session)return enterWith(data.user);
      return showAuth('check',{email});
    }
    if(kind==='signin'){
      const {data,error}=await SB.auth.signInWithPassword({email,password:d.password});
      if(error)throw error;
      return enterWith(data.user);
    }
    if(kind==='forgot'){
      const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:appUrl()});
      if(error)throw error;
      return showAuth('sent');
    }
    if(kind==='newpass'){
      const {data,error}=await SB.auth.updateUser({password:d.password});
      if(error)throw error;
      recovering=false;history.replaceState(null,'',appUrl());
      toast('Mot de passe enregistré.');
      return enterWith(data.user);
    }
  }catch(e){setErr(f,'form',authMsg(e))}
  finally{if(btn.isConnected){btn.disabled=false;btn.textContent=label}}
}
async function waitSync(ms=5000){
  Store.now();const t0=Date.now();
  while((Store.busy||Store.dirtyCore||Store.months.size)&&Date.now()-t0<ms)await new Promise(r=>setTimeout(r,150));
  return !(Store.dirtyCore||Store.months.size||Store.pending);
}
async function logout(global){
  if(!SB)return;
  if(!await ask(global?'Déconnecter tous tes appareils ?':'Se déconnecter ?','Tes données restent enregistrées dans ton compte.',{ok:'Se déconnecter'}))return;
  const synced=await waitSync();
  if(!synced&&!await ask('Changements non synchronisés','Certains changements n\u2019ont pas encore été envoyés (pas de connexion ?). Si tu te déconnectes maintenant, ils seront perdus.',{ok:'Me déconnecter quand même',danger:true}))return;
  try{await SB.auth.signOut(global?{scope:'global'}:undefined)}catch(e){}
  Store.clearCache();location.replace(appUrl());
}
function openChangePass(){
  const s=sheet(`<h2>Changer de mot de passe</h2><form novalidate>${passField('Nouveau mot de passe (8 caractères minimum)','new-password')}${passField('Confirme le mot de passe','new-password','password2')}<p class="err" data-err="form"></p><button class="btn block" type="submit">Enregistrer</button></form>`);
  const f=s.querySelector('form');
  f.addEventListener('submit',async e=>{
    e.preventDefault();const d=readForm(f);
    if(!(setErr(f,'password',(d.password||'').length>=8?'':'8 caractères minimum.')&setErr(f,'password2',d.password===d.password2?'':'Les deux mots de passe sont différents.')))return;
    const {error}=await SB.auth.updateUser({password:d.password});
    if(error){setErr(f,'form',authMsg(error));return}
    closeSheet();toast('Mot de passe modifié.');
  });
}
async function deleteAccount(){
  if(!SB)return;
  if(!await ask('Supprimer ton compte ?','Toutes tes données seront effacées définitivement : poches, échéances, objectifs, historique. Pense à faire une sauvegarde avant.',{ok:'Continuer',danger:true}))return;
  if(!await ask('Dernière confirmation','Cette action est définitive.',{ok:'Supprimer mon compte',danger:true}))return;
  const {error}=await SB.rpc('serenite_delete_account');
  if(error){toast('Suppression impossible pour l\u2019instant. Réessaie plus tard.');return}
  try{await SB.auth.signOut()}catch(e){}
  Store.clearCache();location.replace(appUrl());
}
window.addEventListener('online',()=>{if(Store.mode==='supabase')Store.now()});

init();
