    <p class="t num" style="margin:10px 0 2px">${money(saved)} / ${money(g.target)}</p>${done?`<p style="margin:0 0 8px"><span class="reached">${I.check}Objectif atteint</span></p>`:`<p class="s" style="margin:0 0 8px">Reste ${money(rest)}</p>`}${tips}
    <div class="actions"><button class="btn" data-a="saveMoney" data-id="${g.id}">Verser</button><button class="btn ghost" data-w>Retirer</button></div>
    ${moves.length?`<h3 class="grp">Derniers mouvements</h3><div class="list">${moves.map(t=>txRow(t)).join('')}</div>`:''}
    <div class="actions"><button class="btn ghost" data-e>Modifier</button><button class="btn quiet" data-d>Supprimer</button></div>`);
  s.querySelector('[data-w]').onclick=()=>openWithdraw(goalPocket(g),{goal:g.id});

function payWithGrace(o){
  const b=billById(o.billId);if(!b||o.status!=='todo')return;
  if(!canDebit(b.pocket,o.amount)){toast(`Solde insuffisant sur ${pName(b.pocket)} : ${money(Math.max(0,balance(b.pocket)))} disponibles pour ${money(o.amount)}. Rien n\u2019a été débité.`);return}
  const card=document.querySelector(`[data-card="${o.id}"]`);
  const undo={label:'Annuler',fn:()=>{unpayOcc(o);render()}};
  if(card&&animOn()){
    if(!payOcc(o))return;
    card.classList.remove('late','soon');card.classList.add('paid');
    const dot=card.querySelector('.dot');if(dot)dot.className='dot paid';
    const chip=card.querySelector('.chip-st');if(chip){chip.className='chip-st paid pop';chip.textContent='PAYÉ ✓'}
    const w=card.querySelector('.when');if(w)w.textContent="Payé aujourd'hui";
    toast(`${b.name} est payée.`,undo);
    setTimeout(()=>{if(!$('.scrim'))render()},1500);
  }else{if(!payOcc(o))return;render();toast(`${b.name} est payée.`,undo)}
}

function openArchive(p){
  const others=activePockets().filter(x=>x.id!==p.id);
  if(!others.length){toast('Garde au moins une poche active.');return}
  const v=balance(p.id),bills=S.bills.filter(b=>!b.deleted&&b.pocket===p.id),goals=S.goals.filter(g=>goalPocket(g)===p.id);
  const needDest=v!==0||bills.length||goals.length;
  const destOpts=(goals.length?others.filter(x=>x.type==='epargne'):others).map(x=>[x.id,pName(x.id)]);
  if(needDest&&!destOpts.length){toast('Crée d\u2019abord une autre poche épargne pour y déplacer les objectifs.');return}
  const lines=[v?`son solde de ${money(v)}`:'',bills.length?`${bills.length} échéance${bills.length>1?'s':''}`:'',goals.length?`${goals.length} objectif${goals.length>1?'s':''}`:''].filter(Boolean);
  const s=sheet(`<h2>Archiver ${esc(pName(p.id))}</h2><p class="sub">Elle disparaît de tes écrans, mais son historique est conservé. Tu pourras la restaurer.</p><form novalidate>
    ${needDest?`<p class="hint" style="margin:0 0 12px">Avant d'archiver, on déplace ${lines.join(', ')} vers une autre poche.</p>${F.select('dest','Vers',destOpts,destOpts[0][0])}`:''}
    <button class="btn block" type="submit">Archiver</button></form>`);
  s.querySelector('form').addEventListener('submit',e=>{
    e.preventDefault();const dest=needDest?s.querySelector('[name=dest]').value:null;
    if(dest){
      for(const g of goals){const saved=goalSaved(g.id);if(saved){const link=uid();addTx({d:today(),a:-saved,p:p.id,k:'transfert',l:'Poche archivée : '+g.name,g:g.id,link},{force:true});addTx({d:today(),a:saved,p:dest,k:'transfert',l:'Poche archivée : '+g.name,g:g.id,link})}g.pocket=dest}
      const rest=balance(p.id);if(rest){const link=uid();addTx({d:today(),a:-rest,p:p.id,k:'transfert',l:'Poche archivée',link},{force:true});addTx({d:today(),a:rest,p:dest,k:'transfert',l:'Poche archivée',link})}
      bills.forEach(b=>b.pocket=dest);
    }
    p.archived=true;Store.core();closeSheet();
    if(U.view==='pocket'&&U.pocket===p.id){U.view='pockets';U.stack=[]}
    render();toast(`${pName(p.id)} est archivée.`);
  });
}

/* ---------- Mode discret ---------- */
const MONEY_RE=/[−+-]?\d{1,3}(?:[\s\u00a0\u202f]\d{3})*,\d{2}[\s\u00a0\u202f]?€/g;
const maskText=x=>String(x).replace(MONEY_RE,'••••\u00a0€');
function maskMoney(root){
  if(!U.discreet||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){const v=maskText(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
}

    '--bg':bg,'--surface':surface,'--surface-2':dark?mixHex(bg,'#FFFFFF',0.1):mixHex(bg,'#3A2F25',0.045),'--track':dark?mixHex(bg,'#FFFFFF',0.09):mixHex(bg,'#3A2F25',0.05),

    '--hero-bg':dark?mixHex(hex,bg,0.82):mixHex(hex,bg,0.74),'--brand-ink':ink,'--on-brand':onBrand,

let locked=false,pinBuf='',fails=0,lockUntil=0,lastActive=Date.now(),hiddenAt=0;
async function hashPin(pin,salt){
  const data=new TextEncoder().encode(salt+':'+pin);
  if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  let h=2166136261;for(const c of data){h^=c;h=Math.imul(h,16777619)>>>0}return 'f'+h.toString(16);
}
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function openPin(){
  const has=!!S.settings.pinHash;
  const s=sheet(`<h2>${has?'Code PIN':'Créer un code PIN'}</h2><p class="sub">${has?'Change ou désactive ton code.':'4 à 6 chiffres, demandés à chaque ouverture de l\u2019appli.'}</p><form novalidate>
    ${has?F.pin('cur','Code actuel'):''}${F.pin('p1',has?'Nouveau code':'Code')}${F.pin('p2','Confirme le code')}
    <button class="btn block" type="submit">${has?'Changer le code':'Activer le code'}</button>
    ${has?'<button class="btn quiet block mt" type="button" data-off>Désactiver le code</button>':''}</form>`);
  const f=s.querySelector('form');
  const checkCur=async()=>{if(!has)return true;const h=await hashPin(f.cur.value,S.settings.pinSalt);return setErr(f,'cur',h===S.settings.pinHash?'':'Code actuel incorrect.')};
  f.addEventListener('submit',async e=>{
    e.preventDefault();if(!await checkCur())return;
    const p1=f.p1.value,p2=f.p2.value;
    if(!setErr(f,'p1',/^\d{4,6}$/.test(p1)?'':'Entre 4 à 6 chiffres.'))return;
    if(!setErr(f,'p2',p1===p2?'':'Les deux codes sont différents.'))return;
    const salt=b64(crypto.getRandomValues(new Uint8Array(12)));
    S.settings.pinSalt=salt;S.settings.pinHash=await hashPin(p1,salt);S.settings.pinLen=p1.length;
    Store.core();closeSheet();render();toast(has?'Code modifié.':'Code PIN activé.');
  });
  const off=s.querySelector('[data-off]');
  if(off)off.onclick=async()=>{if(!await checkCur())return;S.settings.pinHash=null;S.settings.pinSalt=null;S.settings.bio=null;Store.core();closeSheet();render();toast('Code PIN désactivé.')};
}
async function bioEnable(){

    S.settings.bio=b64(cred.rawId);Store.core();toast('Face ID / Touch ID activé.');return true;

let bioFails=0,bioBusy=false;
async function bioUnlock(fromTap){
  if(!locked||bioBusy||!S.settings.bio)return;
  bioBusy=true;const t0=Date.now();
  try{
    await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(S.settings.bio),transports:['internal']}],userVerification:'required',timeout:60000}});

    bioBusy=false;
    const blocked=!fromTap&&Date.now()-t0<900&&e&&e.name==='NotAllowedError';
    const unsupported=e&&['NotSupportedError','SecurityError','InvalidStateError'].includes(e.name);
    if(unsupported){bioFails=3}else if(!blocked){bioFails++}
    if(bioFails>=3){showKeypad();return}
    const m=$('#lockMsg');if(m)m.textContent=blocked?'Touche l\u2019écran pour utiliser Face ID':'Touche l\u2019écran pour réessayer';
  }

  setVol(which,v){if(!this.ctx||which!=='fx')return;this.fxG.gain.setTargetAtTime(v,this.ctx.currentTime,0.05)},
  tone(out,freq,t,{dur=2,vol=0.2,type='sine',attack=0.01,partials=[[1,1]]}={}){
    const c=this.ctx,g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(out);
    for(const [mul,amp] of partials){const o=c.createOscillator();o.type=type;o.frequency.value=freq*mul;const pg=c.createGain();pg.gain.value=amp;o.connect(pg);pg.connect(g);o.start(t);o.stop(t+dur+0.05)}
  },
  fx(name){
    if(!name||name==='aucun'||!S||!this.ok())return;
    const c=this.ctx,o=this.fxG,t=c.currentTime+0.02;
    if(name==='doux'){this.tone(o,659.25,t,{dur:0.9,vol:0.22,attack:0.02,partials:[[1,1],[2,0.15]]});this.tone(o,987.77,t+0.16,{dur:1.1,vol:0.18,attack:0.02,partials:[[1,1],[2,0.15]]})}
    else if(name==='piano'){[523.25,659.25,783.99].forEach((f,i)=>this.tone(o,f,t+i*0.13,{dur:1.6,vol:0.22,attack:0.006,partials:[[1,1],[2,0.35],[3,0.12]]}))}
    else if(name==='goutte'){for(const [dt,f0,v] of [[0,1500,0.3],[0.16,1900,0.13]]){const os=c.createOscillator(),g=c.createGain();os.frequency.setValueAtTime(f0,t+dt);os.frequency.exponentialRampToValueAtTime(f0*0.38,t+dt+0.12);g.gain.setValueAtTime(0.0001,t+dt);g.gain.linearRampToValueAtTime(v,t+dt+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.18);os.connect(g);g.connect(o);os.start(t+dt);os.stop(t+dt+0.2)}}
    else if(name==='cloche'){this.tone(o,880,t,{dur:2.6,vol:0.2,attack:0.004,partials:[[1,1],[2.76,0.45],[5.4,0.25],[8.93,0.12]]})}
  },
  stopAmb(){}
};

async function saveFile(name,data,mime){
  if(DL){
    try{const r=await DL.save({filename:name,data});if(r&&r.status==='saved')toast('Fichier enregistré.')}
    catch(e){const code=e&&e.code;if(code==='declined')return;toast(code==='rate_limited'?'Un enregistrement est déjà en cours.':'Enregistrement impossible dans cet affichage.')}
    return;
  }
  try{const blob=data instanceof Blob?data:new Blob([data],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
  catch(e){toast('Enregistrement impossible.')}
}
function csvHistory(){
  const q=v=>{const s=String(v??'');return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const head=['Date','Type','Montant','Motif','Lieu','Catégorie','Sous-catégorie','Solde concerné','Objectif'];
  const rows=allTx().slice().reverse().map(t=>{const c=catById(t.c),p=c&&c.p?catById(c.p):null;const g=t.g?goalById(t.g):null;return [t.d,KIND[t.k]||t.k,(t.a/100).toFixed(2).replace('.',','),t.l||'',t.w||'',p?p.n:(c?c.n:''),p?c.n:'',pName(t.p),g?g.name:'']});
  return '\ufeff'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n');
}

async function makePDF(period){
  toast('Préparation du PDF…');
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')}catch(e){toast('Impossible de charger le module PDF. Vérifie ta connexion.');return}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});

  const L=16,R=194;let y=20;
  const ink=[51,64,74],grey=[102,114,124];
  const put=(s,x,o={})=>{doc.setFont('helvetica',o.bold?'bold':'normal');doc.setFontSize(o.size||10);doc.setTextColor(...(o.color||ink));doc.text(P(s),x,y,o.align?{align:o.align}:undefined)};
  const ensure=h=>{if(y+h>282){doc.addPage();y=20}};
  const line=(l,r,o={})=>{ensure(6);put(l,L+(o.indent||0),o);put(r,R,Object.assign({},o,{align:'right'}));y+=6};
  const h=s=>{ensure(16);y+=5;put(s,L,{size:13,bold:true});y+=2.5;doc.setDrawColor(205,210,214);doc.line(L,y,R,y);y+=6};
  const cut=(s,n)=>{s=P(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
  put('Poka Finance',L,{size:22,bold:true});y+=7;put('Relevé du '+dLong(today()),L,{color:grey});y+=4;
  const f=forecast();
  h('Soldes');activePockets().forEach(p=>line(pName(p.id),money(balance(p.id))));line('Total',money(f.total),{bold:true});line(`Disponible réel (jusqu'au ${dLong(f.h)})`,money(f.dispo),{bold:true});
  h('Échéances à payer');const td=todoOcc();if(!td.length)line('Aucune échéance à payer','');td.forEach(o=>line(`${cut(billName(o),60)}, ${dShort(o.due)}${o.due<today()?' (en retard)':''}`,money(o.amount)));
  const loans=S.bills.filter(b=>b.type==='credit'&&!b.deleted);
  if(loans.length){h('Crédits');loans.forEach(b=>{const s=loanStats(b);line(`${cut(b.name,40)}${b.loan&&b.loan.ref?' (réf. '+cut(b.loan.ref,20)+')':''}`,`reste ${money(s.remaining)} sur ${money(s.total)}`)})}
  if(S.goals.length){h("Objectifs d'épargne");S.goals.forEach(g=>{const sv=Math.max(0,goalSaved(g.id));line(cut(g.name,50),`${money(sv)} / ${money(g.target)} (${fmtPct(g.target?Math.min(100,sv/g.target*100):0)})`)})}
  const t=today();let from,to=t,label;
  if(period==='last'){from=startOfMonth(addMonths(startOfMonth(t),-1));to=endOfMonth(from);label=cap(fMonth.format(parseISO(from)))}
  else if(period==='3m'){from=startOfMonth(addMonths(startOfMonth(t),-2));label='Les 3 derniers mois'}
  else if(period==='year'){from=t.slice(0,4)+'-01-01';label='Année '+t.slice(0,4)}
  else if(period==='all'){from='0000-01-01';label='Tout l\u2019historique'}
  else{from=startOfMonth(t);to=endOfMonth(t);label=cap(fMonth.format(parseISO(from)))}
  const m=metrics(from,to);
  h('Résumé : '+label);line('Revenus',money(m.revenus));line('Dépenses',money(m.depenses));line('Dont échéances',money(m.echeances),{indent:4});line('Dont achats',money(m.achats),{indent:4});line('Épargne (versements nets)',money(m.epargne));line('Solde de la période',signed(m.net),{bold:true});
  h('Opérations');
  const list=allTx().filter(x=>x.d>=from&&x.d<=to);
  if(!list.length)line('Aucune opération sur cette période.','');
  else{
    ensure(8);put('Date',L,{size:9,color:grey});put('Motif',L+22,{size:9,color:grey});put('Catégorie',L+92,{size:9,color:grey});put('Solde',L+132,{size:9,color:grey});put('Montant',R,{size:9,color:grey,align:'right'});y+=6;
    list.forEach(x=>{ensure(6);put(fDY.format(parseISO(x.d)),L,{size:9});put(cut(x.l||KIND[x.k],38),L+22,{size:9});put(cut(x.c?catName(x.c):KIND[x.k],22),L+92,{size:9});put(cut(pName(x.p),18),L+132,{size:9});put(signed(x.a),R,{size:9,align:'right'});y+=5.5});
  }
  saveFile(`poka-releve-${today()}.pdf`,doc.output('blob'),'application/pdf');
}

let SB=null,ACCOUNT=null,recovering=false;

function authMsg(error){
  const m=String((error&&error.message)||error||'').toLowerCase();
  if(m.includes('invalid login'))return 'E-mail ou mot de passe incorrect.';
  if(m.includes('not confirmed'))return 'Confirme d\u2019abord ton adresse e-mail (pense à regarder dans les spams).';
  if(m.includes('already registered')||m.includes('already been registered')||m.includes('already exists'))return 'Un compte existe déjà avec cet e-mail. Connecte-toi.';
  if(m.includes('rate limit')||m.includes('too many')||m.includes('security purposes'))return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(m.includes('weak')||(m.includes('password')&&m.includes('least')))return 'Mot de passe trop court ou trop simple.';
  if(m.includes('fetch')||m.includes('network')||m.includes('load failed'))return 'Pas de connexion internet.';
  return 'Une erreur est survenue. Réessaie dans un instant.';
}

  Store.sb=SB;Store.mode='supabase';
  SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;showAuth('newpass')}});
  let session=null;

    sent:()=>`${authHead()}<div class="auth-form"><h2>E-mail envoyé</h2><p class="auth-sub">Si un compte existe pour cette adresse, un lien vient d'être envoyé. Ouvre-le pour choisir un nouveau mot de passe.</p><button class="btn block" data-auth="signin">Retour à la connexion</button></div>`,
    newpass:()=>`${authHead()}<form class="auth-form" novalidate data-form="newpass"><h2>Nouveau mot de passe</h2>${passField('Nouveau mot de passe (8 caractères minimum)','new-password')}${passField('Confirme le mot de passe','new-password','password2')}<p class="err" data-err="form"></p><button class="btn block" type="submit">Enregistrer</button></form>`
  };

  const first=el.querySelector('input');if(first&&matchMedia('(pointer:fine)').matches)first.focus();

  const f=el.querySelector('form');if(f)f.onsubmit=e=>{e.preventDefault();submitAuth(f.dataset.form,f)};

async function submitAuth(kind,f){
  const d=readForm(f),btn=f.querySelector('[type=submit]');
  const email=(d.email||'').trim().toLowerCase();
  let ok=true;
  if('email' in d)ok=setErr(f,'email',/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)?'':'Adresse e-mail invalide.')&&ok;
  if(kind==='signup')ok=setErr(f,'name',d.name?'':'Indique ton prénom.')&&ok;
  if(kind==='signup'||kind==='newpass')ok=setErr(f,'password',(d.password||'').length>=8?'':'8 caractères minimum.')&&ok;
  if(kind==='signin')ok=setErr(f,'password',d.password?'':'Indique ton mot de passe.')&&ok;
  if(kind==='newpass')ok=setErr(f,'password2',d.password===d.password2?'':'Les deux mots de passe sont différents.')&&ok;
  if(!ok)return;
  setErr(f,'form','');btn.disabled=true;const label=btn.textContent;btn.textContent='Un instant…';
  try{
    if(kind==='signup'){
      const {data,error}=await SB.auth.signUp({email,password:d.password,options:{data:{first_name:d.name.slice(0,30)},emailRedirectTo:appUrl()}});
      if(error)throw error;
      if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)throw new Error('already registered');
      if(data.session)return enterWith(data.user);
      return showAuth('check',{email});
    }
    if(kind==='signin'){
      const {data,error}=await SB.auth.signInWithPassword({email,password:d.password});
      if(error)throw error;
      return enterWith(data.user);
    }
    if(kind==='forgot'){
      const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:appUrl()});
      if(error)throw error;
      return showAuth('sent');
    }
    if(kind==='newpass'){
      const {data,error}=await SB.auth.updateUser({password:d.password});
      if(error)throw error;
      recovering=false;history.replaceState(null,'',appUrl());
      toast('Mot de passe enregistré.');
      return enterWith(data.user);
    }
  }catch(e){setErr(f,'form',authMsg(e))}
  finally{if(btn.isConnected){btn.disabled=false;btn.textContent=label}}
}
async function waitSync(ms=5000){
  Store.now();const t0=Date.now();
  while((Store.busy||Store.dirtyCore||Store.months.size)&&Date.now()-t0<ms)await new Promise(r=>setTimeout(r,150));
  return !(Store.dirtyCore||Store.months.size||Store.pending);
}

    const own=normalize(c.data.data),mine=clone(SELF.S.settings);
    ['theme','accent','animations','amb','sound','soundVol','privacyBlur','discreetStart','pinHash','pinSalt','pinLen','bio','autolock','notif','dailyTime','name'].forEach(k=>own.settings[k]=mine[k]);
    Store.readOnly=true;S=own;TX=tx;_all=null;
    U.viewing={ownerId,name};U.stack=[];U.view='home';U.discreet=false;
    generate();applyTheme();render();window.scrollTo(0,0);
    SB.rpc('serenite_touch_share',{p_owner:ownerId}).then(()=>{},()=>{});
  }catch(e){toast('Accès impossible pour l\u2019instant. La personne a peut-être retiré ton accès.')}
}
function exitView(){
  if(!SELF){U.viewing=null;render();return}
  S=SELF.S;TX=SELF.TX;SELF=null;_all=null;U.viewing=null;Store.readOnly=false;
  U.view='home';U.stack=[];U.shares=null;applyTheme();render();window.scrollTo(0,0);toast('Tu es de retour sur ton compte.');
}
function renderViewBar(){
  let b=$('#viewbar');
  if(!U.viewing){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='viewbar';document.body.appendChild(b)}
  b.innerHTML=`<span>Lecture seule</span><button data-a="exitView">Revenir à mon compte</button>`;
}
ACT.shareReload=()=>{U.shares=null;render()};
init();
</script>
</body>
</html>
